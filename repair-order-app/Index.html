<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#202124;font-family:Arial,'Noto Sans Thai',sans-serif}.wrap{max-width:1050px;margin:32px auto;padding:0 24px}h1{margin:0 0 8px;font-size:30px}.sub{color:#6b7280;margin-bottom:26px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:28px;box-shadow:0 2px 10px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:8px}em{font-style:normal;color:#e5484d}input,select,textarea{font:inherit;width:100%;border:1px solid #d7dbe0;border-radius:8px;padding:12px 13px;outline:none}input:focus,select:focus,textarea:focus{border-color:#d79a00;box-shadow:0 0 0 3px #fff3ca}textarea{min-height:112px;resize:vertical}.radios{display:flex;gap:28px;margin:8px 0 22px}.radios label{font-weight:400;margin:0}.radios input{width:auto;margin-right:6px}.upload{border:2px dashed #d7dbe0;border-radius:10px;padding:30px;text-align:center;cursor:pointer;color:#60646c}.upload:hover{background:#fffaf0;border-color:#e8b028}.upload input{display:none}.hint{font-size:13px;color:#6b7280;margin:7px 0 0}.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.file{background:#fff4d5;padding:7px 10px;border-radius:6px;font-size:13px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:28px}.button{border:0;border-radius:8px;padding:12px 24px;font-weight:700;font-size:16px;cursor:pointer}.primary{background:#f5c84c}.primary:disabled{opacity:.55}.secondary{background:#fff;border:1px solid #d7dbe0}.message{margin-top:20px;padding:15px;border-radius:8px;display:none}.success{display:block;background:#ecfdf3;color:#166534}.error{display:block;background:#fef2f2;color:#b91c1c}@media(max-width:640px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:0 14px;margin:18px auto}.card{padding:18px}}
</style></head><body><main class="wrap"><h1>สร้างรายการแจ้งซ่อม</h1><p class="sub">กรอกข้อมูลและแนบรูปภาพได้สูงสุด 3 รูป</p><form id="repairForm" class="card"><div class="radios"><label>ประเภท <em>*</em></label><label><input type="radio" name="areaType" value="พื้นที่ลูกค้า" checked> พื้นที่ลูกค้า</label><label><input type="radio" name="areaType" value="พื้นที่ส่วนกลาง"> พื้นที่ส่วนกลาง</label></div><div class="grid"><div><label>ชื่อผู้แจ้ง <em>*</em></label><input name="requesterName" placeholder="ระบุชื่อผู้แจ้ง" required></div><div><label>เบอร์โทรศัพท์สำหรับติดต่อกลับ <em>*</em></label><input name="phone" inputmode="tel" placeholder="ระบุเบอร์โทรศัพท์" required></div><div><label>บ้านเลขที่ / สถานที่แจ้งซ่อม <em>*</em></label><input name="serviceArea" placeholder="เช่น 1/1, A101" required></div><div><label>อาคาร</label><input name="building" placeholder="ระบุอาคาร"></div><div><label>ชั้น</label><input name="floor" placeholder="ระบุชั้น"></div><div><label>ประเภทงานซ่อม <em>*</em></label><select name="category" id="category" required><option value="">เลือกประเภทงานซ่อม</option></select></div><div class="full"><label>หัวข้อการแจ้งซ่อม <em>*</em></label><input name="subject" maxlength="100" placeholder="หัวข้อการแจ้งซ่อม" required></div><div class="full"><label>รายละเอียด</label><textarea name="detail" maxlength="1000" placeholder="ระบุรายละเอียดของปัญหา"></textarea></div><div class="full"><label>ไฟล์แนบ</label><label class="upload">📷<br><strong>ลากรูปมาที่นี่หรือคลิกเพื่อเลือก</strong><br><span class="hint">JPEG หรือ PNG, สูงสุด 3 รูป, รูปละไม่เกิน 6 MB</span><input id="files" type="file" accept="image/jpeg,image/png" multiple></label><div id="fileList" class="files"></div></div></div><div class="actions"><button type="reset" class="button secondary">ล้างข้อมูล</button><button id="submit" class="button primary" type="submit">สร้างใบงาน</button></div><div id="message" class="message"></div></form></main><script>
let attachments=[];const $=s=>document.querySelector(s);google.script.run.withSuccessHandler(c=>c.categories.forEach(x=>$('#category').insertAdjacentHTML('beforeend',`<option>${x}</option>`))).getConfig();
$('#files').addEventListener('change',async e=>{const selected=[...e.target.files];if(selected.length+attachments.length>3)return alert('แนบรูปได้สูงสุด 3 รูป');for(const f of selected){if(f.size>6*1024*1024)return alert('ไฟล์ '+f.name+' มีขนาดเกิน 6 MB');attachments.push({name:f.name,dataUrl:await readFile(f)});}renderFiles();e.target.value=''});function readFile(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}function renderFiles(){$('#fileList').innerHTML=attachments.map((f,i)=>`<span class="file">${f.name} <a href="#" onclick="removeFile(${i});return false">×</a></span>`).join('')}function removeFile(i){attachments.splice(i,1);renderFiles()}
$('#repairForm').addEventListener('submit',e=>{e.preventDefault();const form=Object.fromEntries(new FormData(e.target));form.attachments=attachments;$('#submit').disabled=true;$('#message').className='message';google.script.run.withSuccessHandler(res=>{const t=res.ticket;$('#message').className='message success';$('#message').innerHTML=`สร้างใบงาน <strong>${t.ticketNo}</strong> เรียบร้อยแล้ว — <a target="_blank" href="${res.printUrl}">เปิดใบงานเพื่อพิมพ์</a>`;e.target.reset();attachments=[];renderFiles();$('#submit').disabled=false}).withFailureHandler(err=>{$('#message').className='message error';$('#message').textContent=err.message;$('#submit').disabled=false}).submitTicket(form)})
</script></body></html>
